name: procurepulse
version: "1.0.0"
config-version: 2
profile: procurepulse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Analysis window of the BPI Challenge 2019 log. Events outside are kept but flagged.
  window_start: "2018-01-01"
  window_end: "2019-02-01"

models:
  procurepulse:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  procurepulse:
    +schema: reference

data_tests:
  procurepulse:
    +severity: error
