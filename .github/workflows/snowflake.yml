name: snowflake

# Manual: load the SAP landing zone into Snowflake and run the same dbt project there.
# Secrets (Settings > Secrets and variables > Actions):
#   SNOWFLAKE_ACCOUNT      orgname-accountname
#   SNOWFLAKE_USER         PP_CI
#   SNOWFLAKE_PRIVATE_KEY  PEM private key of PP_CI (public key set by infra/snowflake)
on:
  workflow_dispatch:
    inputs:
      load_raw:
        description: "Reload RAW from a fresh SAP extract"
        type: boolean
        default: true

jobs:
  snowflake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: pip install -r requirements.txt -r requirements-snowflake.txt
      - run: make data extract
      - name: Load RAW (role PP_LOADER)
        if: ${{ inputs.load_raw }}
        run: make snowflake-load
      - name: dbt build on Snowflake (role PP_TRANSFORMER)
        run: make snowflake-dbt
      - name: Analytics on DuckDB, results to Snowflake ANALYTICS
        run: |
          make dbt analytics ml
          make snowflake-analytics
