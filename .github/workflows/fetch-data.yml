name: fetch-data

# Downloads the BPI Challenge 2019 log, verifies it against the published
# statistics (1,595,923 events, 251,734 cases), converts it to Parquet and
# publishes it on the orphan branch `data`.
# Primary source: 4TU.ResearchData. Fallback: a public Git LFS mirror, accepted
# only if its LFS checksum matches and the event/case counts reproduce exactly.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  MIRROR_REPO: https://github.com/Gength/generalization_analysis.git
  MIRROR_PATH: data/BPI-Challenge_2019/BPI_Challenge_2019.xes.gz
  MIRROR_SHA256: ed30c44c7ab4c48d0295dccb8cb4b11efb5598bb32274c589d8addf7a793738a

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow==19.0.1
      - name: Try 4TU.ResearchData
        id: primary
        continue-on-error: true
        run: python scripts/fetch_bpic2019.py --out out
      - name: Fallback to verified mirror
        if: steps.primary.outcome != 'success'
        run: |
          rm -rf out mirror
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse "$MIRROR_REPO" mirror
          cd mirror
          git sparse-checkout set "$(dirname "$MIRROR_PATH")"
          git lfs pull --include "$MIRROR_PATH"
          echo "$MIRROR_SHA256  $MIRROR_PATH" | sha256sum -c -
          cd ..
          python scripts/fetch_bpic2019.py --out out --local-file "mirror/$MIRROR_PATH" \
            --local-source "Git LFS mirror of the 4TU file ($MIRROR_REPO), counts verified"
      - name: Publish to branch `data`
        run: |
          rm -rf mirror
          git config user.name  "procurepulse-bot"
          git config user.email "procurepulse-bot@users.noreply.github.com"
          git switch --orphan data
          git rm -rf --quiet . || true
          mkdir -p raw && mv out/* raw/
          printf "# data branch\n\nGenerated by the fetch-data workflow. See raw/manifest.json.\nSource: BPI Challenge 2019 (van Dongen, 2019), 4TU.ResearchData, CC BY 4.0.\n" > README.md
          git add raw README.md
          git commit -m "data: BPI Challenge 2019 as Parquet"
          git push --force origin data
