name: fetch-data

# Downloads the BPI Challenge 2019 log from 4TU.ResearchData, converts it to
# Parquet and publishes it on the orphan branch `data`, so that every later
# job (and every developer) reads one verified, versioned copy.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow==19.0.1
      - run: python scripts/fetch_bpic2019.py --out out
      - name: Publish to branch `data`
        run: |
          git config user.name  "procurepulse-bot"
          git config user.email "procurepulse-bot@users.noreply.github.com"
          git switch --orphan data
          git rm -rf --quiet . || true
          mkdir -p raw && mv out/* raw/
          printf "# data branch\n\nGenerated by the fetch-data workflow. See raw/manifest.json.\nSource: BPI Challenge 2019, 4TU.ResearchData, CC BY 4.0.\n" > README.md
          git add raw README.md
          git commit -m "data: BPI Challenge 2019 as Parquet"
          git push --force origin data
